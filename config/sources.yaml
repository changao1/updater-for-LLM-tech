# Data source configuration

arxiv:
  # arXiv categories to monitor
  categories:
    - cs.CL   # Computation and Language
    - cs.AI   # Artificial Intelligence
    - cs.LG   # Machine Learning
    - cs.SE   # Software Engineering (for coding-related)
  # Hard cap on papers fetched per run. The query is constrained to a
  # submittedDate range (see arxiv_collector.py), so this only matters on
  # unusually high-volume windows; results are kept newest-first.
  max_results: 600
  # Fetch papers submitted in the last N days. The collector now uses an
  # explicit submittedDate:[...] range, so this lookback is actually honored
  # (it isn't capped to "the newest 200" anymore). 3 days bridges the Fri→Mon
  # gap so Monday's run still backfills late-Friday submissions.
  lookback_days: 3

github:
  # Repos are discovered automatically via trending + keyword filter + star-growth ranking.
  # No hand-maintained tracked_repos list — if a repo matters, it'll surface through those signals.

  # GitHub Trending settings
  trending:
    # Languages to track on GitHub Trending
    languages:
      - python
      - jupyter-notebook
    # Minimum stars to include a trending repo
    min_stars: 50
    # Spoken language filter (empty = all)
    spoken_language: ""

# NOTE: Papers with Code was removed — the paperswithcode.com API was shut
# down by Meta in 2025 and no longer returns valid responses.
